name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Tests
        run: npm run test
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      - name: Build
        run: |
          npm run build
          echo "<!-- Version: $(node -p "require('./package.json').version") -->" >> dist/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify Deployment
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Expected version: $VERSION"
          URL="${{ steps.deployment.outputs.page_url }}"
          echo "Testing URL: $URL"
          for i in {1..10}; do
            echo "Attempt $i: Fetching $URL"
            HTML=$(curl -sL --fail "$URL") || true
            if echo "$HTML" | grep -q "<!-- Version: $VERSION -->"; then
              echo "Deployment verified! Version $VERSION is live."
              exit 0
            fi
            echo "Version $VERSION not found yet. Retrying in 15s..."
            sleep 15
          done
          echo "Deployment verification failed! Version $VERSION was not found on the live site."
          exit 1
